<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GROWTH Clock</title>
<style>
  :root {
    --bg: #ffffff;
    --line: #1f1f1f;
    --card: #232323;
    --digit: #f3f0e8;
    --ink: #1f1f1f;
    --muted: #8a867e;
    --red: #b4533f;
    --yellow: #d9b95b;
    --blue: #3e5c86;
    --paper: #f6f4ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --line: #3a3a3a;
      --card: #2c2c2c;
      --digit: #ece8de;
      --ink: #ece8de;
      --muted: #8f8b83;
      --red: #9e4a39;
      --yellow: #b89b4e;
      --blue: #3a5578;
      --paper: #202020;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: "Futura", "Avenir Next", "Helvetica Neue", "PingFang SC", sans-serif;
    color: var(--ink);
    padding: 6px;
    -webkit-font-smoothing: antialiased;
  }

  /* 蒙德里安网格：用 gap + 背景色当线条 */
  .frame {
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 34%;
    grid-template-rows: 1fr 30%;
    gap: 3px;
    background: var(--line);
    border: 3px solid var(--line);
    --h: min(56vh, 15vw);
  }
  .cell { background: var(--bg); position: relative; overflow: hidden; }

  .clock {
    grid-row: 1 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(var(--h) * 0.08);
  }
  .colon {
    display: flex; flex-direction: column; gap: calc(var(--h) * 0.18);
    margin: 0 calc(var(--h) * 0.04);
  }
  .colon i {
    display: block; width: calc(var(--h) * 0.07); height: calc(var(--h) * 0.07);
    background: var(--ink);
  }
  .pair { display: flex; gap: calc(var(--h) * 0.05); }

  /* 秒进度：底部一条细红线 */
  .seconds {
    position: absolute; left: 0; bottom: 0; height: 3px;
    background: var(--red); width: 0;
    transition: width 1s linear;
  }

  .date {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: calc(var(--h) * 0.06);
    background: var(--paper);
  }
  .date .ym {
    font-size: calc(var(--h) * 0.16);
    letter-spacing: 0.18em;
    color: var(--muted);
  }
  .date .card { --ch: calc(var(--h) * 0.78); }

  .foot { display: grid; grid-template-columns: 1fr 24% 9%; gap: 3px; background: var(--line); }
  .foot > div { background: var(--bg); }
  .week {
    background: var(--yellow) !important;
    display: flex; align-items: center; justify-content: center;
    gap: 0.6em;
    font-size: calc(var(--h) * 0.17);
    letter-spacing: 0.16em;
    color: #1f1f1f;
  }
  .week span:last-child { letter-spacing: 0.05em; }
  .blue { background: var(--blue) !important; }
  .red { background: var(--red) !important; }

  /* 翻页卡片 */
  .card {
    --ch: var(--h);
    position: relative;
    width: calc(var(--ch) * 0.66);
    height: var(--ch);
    perspective: calc(var(--ch) * 4);
  }
  .half {
    position: absolute; left: 0; right: 0; height: 50%;
    overflow: hidden; background: var(--card);
  }
  .half span {
    display: block;
    height: var(--ch);
    line-height: var(--ch);
    text-align: center;
    font-size: calc(var(--ch) * 0.74);
    font-weight: 500;
    color: var(--digit);
    font-variant-numeric: tabular-nums;
  }
  .top { top: 0; border-radius: 3px 3px 0 0; }
  .bottom { bottom: 0; border-radius: 0 0 3px 3px; }
  .bottom span { transform: translateY(-50%); }
  .card::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: var(--bg); opacity: 0.55; z-index: 3;
  }
  .flap { z-index: 2; backface-visibility: hidden; }
  .flap.top { transform-origin: 50% 100%; animation: flipTop 0.28s ease-in forwards; }
  .flap.bottom { transform-origin: 50% 0; transform: rotateX(90deg); animation: flipBottom 0.28s 0.28s ease-out forwards; }
  @keyframes flipTop { to { transform: rotateX(-90deg); } }
  @keyframes flipBottom { to { transform: rotateX(0deg); } }
</style>
</head>
<body>
  <div class="frame">
    <div class="cell clock">
      <div class="pair"><div class="card" id="h1"></div><div class="card" id="h2"></div></div>
      <div class="colon"><i></i><i></i></div>
      <div class="pair"><div class="card" id="m1"></div><div class="card" id="m2"></div></div>
      <div class="seconds" id="sec"></div>
    </div>
    <div class="cell date">
      <div class="ym" id="ym"></div>
      <div class="pair"><div class="card" id="d1"></div><div class="card" id="d2"></div></div>
    </div>
    <div class="foot">
      <div class="week"><span id="wkEn"></span><span id="wkZh"></span></div>
      <div class="blue"></div>
      <div class="red"></div>
    </div>
  </div>

<script>
  const WEEK_EN = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  const WEEK_ZH = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

  function half(cls, v) {
    const d = document.createElement("div");
    d.className = "half " + cls;
    const s = document.createElement("span");
    s.textContent = v;
    d.appendChild(s);
    return d;
  }

  function setCard(el, v) {
    if (el.dataset.v === v) return;
    const old = el.dataset.v;
    el.dataset.v = v;
    if (old === undefined) {
      el.append(half("top", v), half("bottom", v));
      return;
    }
    el.querySelectorAll(".flap").forEach(f => f.remove());
    const [top, bottom] = el.querySelectorAll(".half:not(.flap)");
    top.firstChild.textContent = v;
    const flapTop = half("top flap", old);
    const flapBottom = half("bottom flap", v);
    flapBottom.addEventListener("animationend", () => {
      bottom.firstChild.textContent = v;
      flapTop.remove();
      flapBottom.remove();
    });
    el.append(flapTop, flapBottom);
  }

  const pad = n => String(n).padStart(2, "0");
  const $ = id => document.getElementById(id);

  function tick() {
    const now = new Date();
    const hh = pad(now.getHours()), mm = pad(now.getMinutes()), dd = pad(now.getDate());
    setCard($("h1"), hh[0]); setCard($("h2"), hh[1]);
    setCard($("m1"), mm[0]); setCard($("m2"), mm[1]);
    setCard($("d1"), dd[0]); setCard($("d2"), dd[1]);
    $("ym").textContent = now.getFullYear() + " · " + pad(now.getMonth() + 1);
    $("wkEn").textContent = WEEK_EN[now.getDay()];
    $("wkZh").textContent = WEEK_ZH[now.getDay()];
    const sec = $("sec"), s = now.getSeconds();
    sec.style.transition = s === 0 ? "none" : "";
    sec.style.width = (s / 59 * 100) + "%";
  }

  tick();
  setTimeout(() => { tick(); setInterval(tick, 1000); }, 1000 - new Date().getMilliseconds());
</script>
</body>
</html>

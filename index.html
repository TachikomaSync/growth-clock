<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GROWTH Clock</title>
<style>
  :root {
    --bg: #ffffff;
    --line: #2b2b2b;
    --card: #f1eee8;
    --card-low: #e9e5dd;
    --ink: #262626;
    --muted: #9a958c;
    --red: #b4533f;
    --yellow: #d9b95b;
    --blue: #3e5c86;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --line: #4a4a4a;
      --card: #262626;
      --card-low: #222222;
      --ink: #ebe7de;
      --muted: #8f8b83;
      --red: #9e4a39;
      --yellow: #b89b4e;
      --blue: #3a5578;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: "Futura", "Avenir Next", "Helvetica Neue", "PingFang SC", sans-serif;
    color: var(--ink);
    padding: 4px;
    -webkit-font-smoothing: antialiased;
  }

  .frame {
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 30%;
    grid-template-rows: 1fr 28%;
    gap: 2px;
    background: var(--line);
    border: 2px solid var(--line);
    --h: min(58vh, 13.5vw);
  }
  .frame > div { background: var(--bg); position: relative; overflow: hidden; }

  /* 时间 */
  .clock {
    grid-row: 1 / 3;
    display: flex; align-items: center; justify-content: center;
  }
  .time { display: flex; align-items: flex-end; gap: calc(var(--h) * 0.12); }
  .pair { display: flex; gap: calc(var(--h) * 0.04); }
  .colon {
    align-self: center;
    display: flex; flex-direction: column; gap: calc(var(--h) * 0.2);
  }
  .colon i { display: block; width: calc(var(--h) * 0.06); height: calc(var(--h) * 0.06); background: var(--ink); }
  .colon i:last-child { background: var(--red); }
  .secs .card { --ch: calc(var(--h) * 0.38); }
  .secs .half span { color: var(--red); }

  /* 日期：纯排版 */
  .date {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 12%;
  }
  .day {
    font-size: calc(var(--h) * 0.95);
    line-height: 0.9;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .month {
    margin-top: calc(var(--h) * 0.1);
    font-size: calc(var(--h) * 0.13);
    letter-spacing: 0.32em;
    color: var(--muted);
  }

  .foot { display: grid; grid-template-columns: 1fr 22% 10%; gap: 2px; background: var(--line) !important; }
  .foot > div { background: var(--bg); }
  .week {
    background: var(--yellow) !important;
    display: flex; align-items: center; padding-left: 12%;
    gap: 0.7em;
    font-size: calc(var(--h) * 0.14);
    letter-spacing: 0.22em;
    color: #262626;
  }
  .blue { background: var(--blue) !important; }
  .red { background: var(--red) !important; }

  /* 翻页卡：浅纸色，下半略深制造厚度 */
  .card {
    --ch: var(--h);
    position: relative;
    width: calc(var(--ch) * 0.64);
    height: var(--ch);
    perspective: calc(var(--ch) * 4);
  }
  .half {
    position: absolute; left: 0; right: 0; height: 50%;
    overflow: hidden; background: var(--card);
  }
  .half span {
    display: block; height: var(--ch); line-height: var(--ch);
    text-align: center;
    font-size: calc(var(--ch) * 0.76);
    font-weight: 400;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .top { top: 0; border-radius: 2px 2px 0 0; }
  .bottom { bottom: 0; border-radius: 0 0 2px 2px; background: var(--card-low); }
  .bottom span { transform: translateY(-50%); }
  .card::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: var(--bg); z-index: 3;
  }
  .flap { z-index: 2; backface-visibility: hidden; }
  .flap.top { transform-origin: 50% 100%; animation: flipTop 0.25s ease-in forwards; }
  .flap.bottom { transform-origin: 50% 0; transform: rotateX(90deg); animation: flipBottom 0.25s 0.25s ease-out forwards; }
  @keyframes flipTop { to { transform: rotateX(-90deg); } }
  @keyframes flipBottom { to { transform: rotateX(0deg); } }
</style>
</head>
<body>
  <div class="frame">
    <div class="clock">
      <div class="time">
        <div class="pair"><div class="card" id="h1"></div><div class="card" id="h2"></div></div>
        <div class="colon"><i></i><i></i></div>
        <div class="pair"><div class="card" id="m1"></div><div class="card" id="m2"></div></div>
        <div class="pair secs"><div class="card" id="s1"></div><div class="card" id="s2"></div></div>
      </div>
    </div>
    <div class="date">
      <div class="day" id="day"></div>
      <div class="month" id="month"></div>
    </div>
    <div class="foot">
      <div class="week"><span id="wkEn"></span><span id="wkZh"></span></div>
      <div class="blue"></div>
      <div class="red"></div>
    </div>
  </div>

<script>
  const WEEK_EN = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  const WEEK_ZH = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  const MONTH = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

  function half(cls, v) {
    const d = document.createElement("div");
    d.className = "half " + cls;
    const s = document.createElement("span");
    s.textContent = v;
    d.appendChild(s);
    return d;
  }

  function setCard(el, v) {
    if (el.dataset.v === v) return;
    const old = el.dataset.v;
    el.dataset.v = v;
    if (old === undefined) {
      el.append(half("top", v), half("bottom", v));
      return;
    }
    el.querySelectorAll(".flap").forEach(f => f.remove());
    const [top, bottom] = el.querySelectorAll(".half:not(.flap)");
    top.firstChild.textContent = v;
    const flapTop = half("top flap", old);
    const flapBottom = half("bottom flap", v);
    flapBottom.addEventListener("animationend", () => {
      bottom.firstChild.textContent = v;
      flapTop.remove();
      flapBottom.remove();
    });
    el.append(flapTop, flapBottom);
  }

  const pad = n => String(n).padStart(2, "0");
  const $ = id => document.getElementById(id);

  function tick() {
    const now = new Date();
    const hh = pad(now.getHours()), mm = pad(now.getMinutes()), ss = pad(now.getSeconds());
    setCard($("h1"), hh[0]); setCard($("h2"), hh[1]);
    setCard($("m1"), mm[0]); setCard($("m2"), mm[1]);
    setCard($("s1"), ss[0]); setCard($("s2"), ss[1]);
    $("day").textContent = pad(now.getDate());
    $("month").textContent = MONTH[now.getMonth()] + " " + now.getFullYear();
    $("wkEn").textContent = WEEK_EN[now.getDay()];
    $("wkZh").textContent = WEEK_ZH[now.getDay()];
  }

  tick();
  setTimeout(() => { tick(); setInterval(tick, 1000); }, 1000 - new Date().getMilliseconds());
</script>
</body>
</html>
